<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Shop — Curated Goods</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --bg: #f5f1ea;
            --surface: #fffdf8;
            --ink: #1a1a1a;
            --muted: #6b6660;
            --accent: #c8501e;
            --line: #1a1a1a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            min-height: 100vh;
            padding: 0;
        }

        .topbar {
            border-bottom: 1px solid var(--line);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .topbar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            margin-right: 0.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .hero {
            padding: 5rem 2rem 3rem;
            border-bottom: 1px solid var(--line);
            position: relative;
            overflow: hidden;
        }

        .hero .eyebrow {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }

        .hero h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 300;
            font-size: clamp(3rem, 9vw, 7.5rem);
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin: 0;
        }

        .hero h1 em {
            font-style: italic;
            font-weight: 500;
            color: var(--accent);
        }

        .hero .subtitle {
            font-family: 'Fraunces', Georgia, serif;
            font-style: italic;
            font-size: 1.25rem;
            color: var(--muted);
            margin-top: 2rem;
            max-width: 540px;
        }

        .hero .marquee-num {
            position: absolute;
            right: 2rem;
            top: 5rem;
            font-family: 'Fraunces', serif;
            font-size: 0.875rem;
            color: var(--muted);
            text-align: right;
            line-height: 1.4;
        }

        .section-label {
            padding: 2rem 2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid rgba(26, 26, 26, 0.15);
        }

        .section-label .title {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            font-weight: 500;
        }

        .section-label .count {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .grid {
            padding: 0 2rem 4rem;
        }

        .product-card {
            background: var(--surface);
            border: 1px solid rgba(26, 26, 26, 0.12);
            padding: 2rem 1.5rem 1.5rem;
            height: 100%;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
            box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1),
            border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
            cursor: pointer;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--ink);
            box-shadow: 8px 8px 0 var(--ink);
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card .idx {
            font-family: 'Fraunces', serif;
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.1em;
        }

        .product-card .name {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1.2;
            margin: 0.75rem 0 1.5rem;
            letter-spacing: -0.01em;
        }

        .product-card .price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 1rem;
            border-top: 1px solid rgba(26, 26, 26, 0.12);
        }

        .product-card .price {
            font-family: 'Fraunces', serif;
            font-size: 1.75rem;
            font-weight: 500;
            color: var(--ink);
            letter-spacing: -0.02em;
        }

        .product-card .price .gel {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            margin-left: 0.4rem;
            vertical-align: middle;
        }

        .product-card .arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, color 0.3s ease, transform 0.3s ease;
        }

        .product-card:hover .arrow {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--surface);
            transform: rotate(-45deg);
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 5rem 2rem;
            text-align: center;
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-size: 1.5rem;
            color: var(--muted);
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
        }

        @media (max-width: 576px) {
            .hero .marquee-num {
                display: none;
            }

            .topbar {
                font-size: 0.65rem;
                padding: 0.75rem 1rem;
            }

            .hero, .grid, footer, .section-label {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="position-absolute top-0 end-0 m-2">
    {% for message in messages %}
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
</div>
{% block content %}
{% endblock %}

<footer>
    <span>© The Shop, MMXXVI</span>
    <span>Made slowly</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
